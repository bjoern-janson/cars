name: asi0-canonical

on:
  pull_request:
    branches: [main]
    paths:
      - experiments/ASI0_CANONICAL_QWEN_CONFIG.json
      - scripts/run_asi0_canonical_qwen.py
      - scripts/run_asi0_canonical_qwen_entry.py
      - .github/workflows/asi0-canonical.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preflight syntax
        run: |
          python - <<'PY'
          import ast
          for path in [
              "scripts/run_asi0_canonical_qwen.py",
              "scripts/run_asi0_canonical_qwen_entry.py",
          ]:
              ast.parse(open(path, encoding="utf-8").read())
              print("AST PASS", path)
          PY
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4"
          python -m pip install "torch==2.4.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.46.3" "safetensors>=0.4.3"
      - name: Execute frozen ASI-0
        run: |
          python scripts/run_asi0_canonical_qwen_entry.py \
            experiments/ASI0_CANONICAL_QWEN_CONFIG.json \
            --outdir results/asi0_canonical_run
          cat results/asi0_canonical_run/asi0_final_summary.json
      - name: Upload scientific record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asi0-canonical-record
          path: results/asi0_canonical_run
          if-no-files-found: warn
          retention-days: 30
