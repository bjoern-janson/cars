name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  notebook-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate seed benchmark
        run: python scripts/validate_cases.py

  pilot0-plumbing:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check API credential availability
        id: credential
        shell: bash
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Repository OPENAI_API_KEY is available to this same-repo PR run."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Repository OPENAI_API_KEY is not available to this workflow."
          fi

      - name: Sample 30 frozen MMLU-Pro plumbing items
        if: steps.credential.outputs.available == 'true'
        run: |
          mkdir -p _pilot0_plumbing
          python scripts/sample_mmlupro.py \
            _pilot0_plumbing/tasks.jsonl \
            --n 30 \
            --seed 20260809

      - name: Run frozen pre-treatment stage
        if: steps.credential.outputs.available == 'true'
        run: |
          python scripts/run_pilot0_openai.py pre \
            _pilot0_plumbing/tasks.jsonl \
            _pilot0_plumbing/pre.jsonl \
            --model gpt-5.6-luna \
            --effort low

      - name: Freeze pre-treatment states
        if: steps.credential.outputs.available == 'true'
        run: |
          python scripts/freeze_pilot0_prestates.py \
            _pilot0_plumbing/pre.jsonl \
            _pilot0_plumbing/pre_frozen.jsonl

      - name: Count eligible initially-wrong blocks
        if: steps.credential.outputs.available == 'true'
        id: eligible
        shell: bash
        run: |
          COUNT=$(python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('_pilot0_plumbing/pre_frozen.jsonl').read_text().splitlines() if x.strip()]
          print(sum(not r['initial_correct'] for r in rows))
          PY
          )
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Initially-wrong eligible blocks: $COUNT"

      - name: Create frozen continuation branches
        if: steps.credential.outputs.available == 'true' && steps.eligible.outputs.count != '0'
        run: |
          python scripts/prepare_pilot0_units.py \
            _pilot0_plumbing/pre_frozen.jsonl \
            _pilot0_plumbing/branches.jsonl \
            --replicates 4

      - name: Randomize within frozen task-prestate blocks
        if: steps.credential.outputs.available == 'true' && steps.eligible.outputs.count != '0'
        run: |
          python scripts/randomize_llm_assay.py \
            _pilot0_plumbing/branches.jsonl \
            _pilot0_plumbing/assignments.jsonl \
            --arms E0 E+ \
            --seed 20260809

      - name: Verify immutable pre-state provenance
        if: steps.credential.outputs.available == 'true' && steps.eligible.outputs.count != '0'
        run: |
          python scripts/verify_pilot0_frozen_state.py \
            _pilot0_plumbing/pre_frozen.jsonl \
            _pilot0_plumbing/assignments.jsonl

      - name: Run randomized post-treatment branches
        if: steps.credential.outputs.available == 'true' && steps.eligible.outputs.count != '0'
        run: |
          python scripts/run_pilot0_openai.py post \
            _pilot0_plumbing/assignments.jsonl \
            _pilot0_plumbing/completed.jsonl \
            --model gpt-5.6-luna \
            --effort low

      - name: Write plumbing-only instrumentation summary
        if: steps.credential.outputs.available == 'true'
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root = Path('_pilot0_plumbing')
          pre = [json.loads(x) for x in (root/'pre_frozen.jsonl').read_text().splitlines() if x.strip()]
          summary = {
              'evidence_status': 'instrumentation evidence only; not hypothesis evidence',
              'sampled_tasks': len(pre),
              'parseable_confidences': sum(isinstance(r.get('p_correct'), (int,float)) and 0 <= r['p_correct'] <= 1 for r in pre),
              'initially_correct': sum(bool(r['initial_correct']) for r in pre),
              'initially_wrong_eligible': sum(not r['initial_correct'] for r in pre),
              'unique_pre_state_hashes': len({r['pre_state_sha256'] for r in pre}),
              'response_models': dict(Counter(str(r.get('response_model')) for r in pre)),
          }
          completed_path = root/'completed.jsonl'
          if completed_path.exists():
              completed = [json.loads(x) for x in completed_path.read_text().splitlines() if x.strip()]
              arm_counts = Counter(r['arm'] for r in completed)
              revisions = Counter()
              final_correct = Counter()
              for r in completed:
                  revisions[r['arm']] += int(r['final_answer'] != r['initial_answer'])
                  final_correct[r['arm']] += int(r['final_correct'])
              summary.update({
                  'post_branches': len(completed),
                  'arm_counts': dict(arm_counts),
                  'revision_counts': dict(revisions),
                  'final_correct_counts': dict(final_correct),
                  'verified_task_blocks': len({r['task_id'] for r in completed}),
              })
          (root/'plumbing_summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload immutable plumbing artifacts
        if: steps.credential.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pilot0-plumbing-${{ github.event.pull_request.head.sha }}
          path: _pilot0_plumbing/
          if-no-files-found: error
          retention-days: 30
