name: validate

on:
  push:
  pull_request:

jobs:
  research-artifact-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate seed benchmark
        run: python scripts/validate_cases.py
      - name: Verify frozen artifact hashes
        run: python scripts/verify_freeze.py
