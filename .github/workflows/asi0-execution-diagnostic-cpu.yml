name: asi0-execution-diagnostic-cpu

on:
  pull_request:
    branches: [main]
    paths:
      - experiments/ASI0_CPU_GPU_DIAGNOSTIC_MANIFEST.json
      - experiments/ASI0_CANONICAL_QWEN_CONFIG.json
      - scripts/run_asi0_canonical_qwen.py
      - scripts/run_asi0_canonical_qwen_entry.py
      - .github/workflows/asi0-execution-diagnostic-cpu.yml

permissions:
  contents: read

jobs:
  cpu-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preflight syntax and manifest
        run: |
          python - <<'PY'
          import ast, json
          for path in [
              "scripts/run_asi0_canonical_qwen.py",
              "scripts/run_asi0_canonical_qwen_entry.py",
          ]:
              ast.parse(open(path, encoding="utf-8").read())
              print("AST PASS", path)
          with open("experiments/ASI0_CPU_GPU_DIAGNOSTIC_MANIFEST.json", encoding="utf-8") as f:
              manifest = json.load(f)
          assert manifest["status"] == "FROZEN EXECUTION DIAGNOSTIC; NON-SCIENTIFIC"
          assert len(manifest["cases"]) == 8
          print("DIAGNOSTIC MANIFEST PASS")
          PY
      - name: Install frozen CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4"
          python -m pip install "torch==2.4.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.46.3" "safetensors>=0.4.3"
      - name: Run CPU diagnostic only
        run: |
          python scripts/run_asi0_canonical_qwen_entry.py \
            experiments/ASI0_CANONICAL_QWEN_CONFIG.json \
            --mode diagnostic \
            --diagnostic-manifest experiments/ASI0_CPU_GPU_DIAGNOSTIC_MANIFEST.json \
            --device cpu \
            --outdir results/asi0_execution_diagnostic_cpu
      - name: Upload CPU behavioral reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asi0-cpu-behavioral-reference
          path: results/asi0_execution_diagnostic_cpu
          if-no-files-found: warn
          retention-days: 30
